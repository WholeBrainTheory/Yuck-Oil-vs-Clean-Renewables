 <metadata><rdf:RDF><cc:Work rdf:about=""><cc:license rdf:resource="http://creativecommons.org/publicdomain/zero/1.0/"/><dc:title>YUCK Coal!</dc:title><dc:date>2026-07-31</dc:date><dc:creator><cc:Agent><dc:title>Peter MacDougall</dc:title></cc:Agent></dc:creator><dc:rights><cc:Agent><dc:title>This work is marked CC0 1.0 Universal. To view a copy of this mark, visit https://creativecommons.org/publicdomain/zero/1.0/</dc:title></cc:Agent></dc:rights><dc:language>English</dc:language><dc:subject><rdf:Bag><rdf:li>Climate Change</rdf:li><rdf:li>Coal</rdf:li><rdf:li>Fossil</rdf:li><rdf:li>Fuel</rdf:li><rdf:li>Poison</rdf:li><rdf:li>Waste</rdf:li><rdf:li>Greenhouse Gas</rdf:li><rdf:li>CO2</rdf:li><rdf:li>Carbon Dioxide</rdf:li><rdf:li>Heavy Metal</rdf:li><rdf:li>Arsenic</rdf:li><rdf:li>Lead</rdf:li><rdf:li>Mercury</rdf:li></rdf:Bag></dc:subject><dc:description>A lump of coal with a disgust expression and the text YUCK Coal!
