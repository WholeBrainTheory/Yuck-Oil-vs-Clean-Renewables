A lump of coal with a disgust expression representing the poisonous nature of coal.
A depiction of a lump of coal with a disgust expression and the text YUCK Coal.
The extraction and use of coal for fuel releases poisons into our environment and harms us directly and indirectly. Coal is toxic compound that should not be burned for energy when alternatives exist.-->
